name: Bug Report
description: Report a bug in the Typen desktop service, OS keyboard hook, Settings UI, or installer.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in **Typen**! If you are reporting a missed spelling correction or false positive, please use the **Correction Report** template instead.
  - type: dropdown
    id: platform
    attributes:
      label: Operating System & Session Type
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x64)
        - Linux (X11 session)
        - Linux (Wayland via IBus engine)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Typen Version
      description: Output of `AutoCorrectDesktop --version` or shown in Settings -> About
      placeholder: "1.2.0-beta.4"
    validations:
      required: true
  - type: input
    id: target_app
    attributes:
      label: Affected Application (if applicable)
      description: In which application were you typing when the issue occurred?
      placeholder: "e.g. Notion, Chrome, VS Code, Obsidian, Terminal"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: health_check
    attributes:
      label: Output of `--headless-check` (optional)
      description: Run `AutoCorrectDesktop --headless-check` in a terminal and paste the one-line output.
      render: shell
