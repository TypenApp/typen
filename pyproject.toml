[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocorrect"
version = "1.2.0"
description = "Offline-first, intelligent, system-wide desktop autocorrect and writing assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "AutoCorrect Engineering"}
]
dependencies = [
    "cryptography>=42.0.0",
    "zstandard>=0.22.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "bachs>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
]
# Language-resource pipeline only (never a runtime dependency): corpus
# frequency rankings used to tier the ESDB/SCOWL dictionary at build time.
pipeline-data = [
    "wordfreq>=3.1.0",
]
macos = [
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]
linux = [
    "python-xlib>=0.33; sys_platform == 'linux'",
]
local-ai = [
    "onnxruntime>=1.17.0",
]
# Out-of-process Desktop Customisation UI: strictly PySide6-Essentials (LGPLv3 modules only;
# never PySide6-Addons or GPLv3 modules such as QtCharts/QtQuick3D).
ui = [
    "PySide6-Essentials>=6.7.0",
]

[project.scripts]
autocorrect-desktop = "autocorrect.launcher:main"
autocorrect-daemon = "autocorrect.daemon.app:main"
autocorrect-settings = "autocorrect.ui.settings_main:main"
autocorrect-sandbox = "autocorrect.sandbox:main"
autocorrect-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["autocorrect*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "."]
ignore_missing_imports = true
